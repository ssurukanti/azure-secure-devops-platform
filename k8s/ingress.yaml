apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: demo.example.com # replace with your host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: demo-app, port: { number: 80 } }
